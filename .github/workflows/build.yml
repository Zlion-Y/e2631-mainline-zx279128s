name: build-e2631-kernel

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改动文档 / 非编译文件时不触发构建；
    # 需要强制构建时用 workflow_dispatch 手动触发
    paths-ignore:
      - 'README'
      - 'README.md'
      - 'README_EN.md'
      - '**/*.md'
      - 'research.md'
      - 'Documentation/**'
      - 'LICENSES/**'
      - 'COPYING'
      - 'CREDITS'
      - 'MAINTAINERS'
      - '.gitignore'
      - '.mailmap'
      - 'upstream-series/**'
  workflow_dispatch:

# 这里只构建内核，不再发布可直接引导的镜像（见下面的注释），
# 所以 GITHUB_TOKEN 保持只读。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev cpio python3 wget

      - name: Install Arm cross toolchain
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-a/10.3-2021.07/binrel/gcc-arm-10.3-2021.07-x86_64-arm-none-linux-gnueabihf.tar.xz
          tar -xf gcc-arm-10.3-2021.07-x86_64-arm-none-linux-gnueabihf.tar.xz
          echo "$PWD/gcc-arm-10.3-2021.07-x86_64-arm-none-linux-gnueabihf/bin" >> $GITHUB_PATH

      - name: Configure
        run: make ARCH=arm CROSS_COMPILE=arm-none-linux-gnueabihf- zx279128s_e2631_defconfig

      - name: Build zImage + board dtb
        run: |
          make ARCH=arm CROSS_COMPILE=arm-none-linux-gnueabihf- -j$(nproc) zImage
          make ARCH=arm CROSS_COMPILE=arm-none-linux-gnueabihf- zte/zx279128s-e2631.dtb
          ls -la arch/arm/boot/zImage arch/arm/boot/dts/zte/zx279128s-e2631.dtb

      - name: Upload kernel and board dtb
        uses: actions/upload-artifact@v4
        with:
          name: e2631-mainline-kernel
          path: |
            arch/arm/boot/zImage
            arch/arm/boot/dts/zte/zx279128s-e2631.dtb

      # 以前这里还有一步：cat zImage + dtb 再用 e2631-tools/pack_uimage.py 封成
      # uImage-e2631.img，并在打 tag 时发到 Release。那条"U-Boot 里 tftp 载入固件"
      # 的通路已经退役到 tag v0.1.1（Release 里那份 uImage-e2631.img 就是它），
      # 真机上的可刷镜像由 e2631-openwrt-build 打包成原厂升级包格式，不再从这里出。
